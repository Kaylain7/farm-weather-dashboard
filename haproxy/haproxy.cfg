# Included inside the existing "server" block of /etc/nginx/sites-available/default
# on web-01 and web-02. Serves the dashboard at /farm/ without touching the
# existing site, redirects or custom 404 page.

location = /farm { return 301 /farm/; }

location /farm/ {
    alias /var/www/farm-weather/;
    try_files $uri $uri/index.html =404;
}
